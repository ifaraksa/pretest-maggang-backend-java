spring.application.name=shop

# Koneksi PostgreSQL (nilai default bisa diganti lewat environment variable)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pretest_shop}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123}

# Skema dibuat oleh Flyway (db/migration), Hibernate hanya memeriksa kecocokan
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
